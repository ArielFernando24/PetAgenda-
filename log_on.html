<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PetAgenda — Cadastro</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <header class="header">
    <h1>PetAgenda</h1>
    <p>Feito com carinho para quem cuida de quem ama.</p>
  </header>

  <main class="main">
    <h2>Bem-vindo!</h2>

    <section class="card">
      <h3>Cadastre-se hoje</h3>

      <form>
        <div class="row">
          <div class="field">
            <label for="nome">Nome</label>
            <input id="nome" type="text" placeholder="nome">
          </div>

          <div class="field">
            <label for="sobrenome">Sobrenome</label>
            <input id="sobrenome" type="text" placeholder="sobrenome">
          </div>
        </div>

        <div class="field full">
          <label for="email">Email</label>
          <input id="email" type="email" placeholder="tutor@petagenda.com">
        </div>

        <div class="row">
          <div class="field">
            <label for="senha">Senha</label>
            <input id="senha" type="password" placeholder="••••••••">
          </div>

          <div class="field">
            <label for="confirmar">Confirmar senha</label>
            <input id="confirmar" type="password" placeholder="••••••••">
          </div>
        </div>

        <button type="submit">Cadastre-se</button>
      </form>
    </section>
  </main>
</body>
</html>
